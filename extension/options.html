<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Notas — Configurações</title>
  <style>
    body {
      max-width: 480px;
      margin: 40px auto;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1f2937;
    }
    h1 { font-size: 18px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .actions { margin-top: 20px; display: flex; gap: 8px; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    #save { background: #2563eb; color: #fff; }
    #test { background: #e5e7eb; color: #1f2937; }
    #status { margin-top: 12px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Configurações — Notas</h1>

  <label for="serverUrl">URL do servidor</label>
  <input type="text" id="serverUrl" placeholder="https://notas.exemplo.com" />
  <div class="hint">Endereço do seu servidor Notas, sem barra final.</div>

  <label for="token">Token da extensão</label>
  <input type="text" id="token" placeholder="opcional" />
  <div class="hint">Necessário apenas se o servidor usa PIN (EXTENSION_TOKEN).</div>

  <div class="actions">
    <button id="save">Salvar</button>
    <button id="test" type="button">Testar conexão</button>
  </div>

  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
